<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 230" fill="none">
  <!-- Left pillar of H -->
  <rect x="38" y="18" width="40" height="120" rx="20" fill="#1E2A45"/>
  <!-- Right pillar of H -->
  <rect x="262" y="18" width="40" height="120" rx="20" fill="#1E2A45"/>

  <!-- Gold house roof -->
  <polyline points="50,108 170,36 290,108" stroke="#C9A84C" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Gold bed headboard -->
  <rect x="116" y="86" width="108" height="24" rx="9" fill="#C9A84C"/>
  <!-- Gold pillows -->
  <rect x="128" y="91" width="30" height="13" rx="6" fill="#F0D080" opacity="0.95"/>
  <rect x="163" y="91" width="30" height="13" rx="6" fill="#F0D080" opacity="0.95"/>
  <!-- Gold bed frame base -->
  <rect x="112" y="107" width="116" height="28" rx="7" fill="#C9A84C"/>
  <!-- Bed legs -->
  <rect x="120" y="132" width="11" height="13" rx="5" fill="#B8923C"/>
  <rect x="209" y="132" width="11" height="13" rx="5" fill="#B8923C"/>

  <!-- Divider line -->
  <line x1="40" y1="168" x2="300" y2="168" stroke="#C9A84C" stroke-width="1.5" opacity="0.45"/>

  <!-- "Sistema de Gestión Hotelera" -->
  <text 
    x="170" 
    y="192" 
    font-family="'Trebuchet MS', Arial, sans-serif" 
    font-size="17" 
    font-weight="800" 
    fill="#1E2A45" 
    text-anchor="middle" 
    letter-spacing="0.8">SISTEMA DE GESTIÓN HOTELERA</text>

  <!-- "by Jcar-Labs" -->
  <text x="170" y="215" font-family="Georgia, 'Times New Roman', serif" font-size="15.5" text-anchor="middle">
    <tspan font-style="italic" fill="#6B7A99">by </tspan><tspan font-weight="700" fill="#1E2A45" font-family="'Trebuchet MS', Arial, sans-serif">Jcar-</tspan><tspan font-weight="700" fill="#1A7A5E" font-family="'Trebuchet MS', Arial, sans-serif">Labs</tspan>
  </text>
</svg>
