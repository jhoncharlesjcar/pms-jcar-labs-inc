name: Apply Staging Migrations
on:
  push:
    branches: [develop]
    paths: ['supabase/migrations/**']

jobs:
  apply:
    name: Apply Migrations
    runs-on: ubuntu-latest
    steps:
      - name: Verify Staging Secrets
        id: check_secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_STAGING_REF" ]; then
            echo "Secrets SUPABASE_ACCESS_TOKEN or SUPABASE_STAGING_REF not configured. Skipping migrations."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_STAGING_REF: ${{ secrets.SUPABASE_STAGING_REF }}

      - uses: actions/checkout@v4
        if: steps.check_secrets.outputs.configured == 'true'

      - name: Setup Supabase CLI
        if: steps.check_secrets.outputs.configured == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        if: steps.check_secrets.outputs.configured == 'true'
        run: supabase link --project-ref ${{ secrets.SUPABASE_STAGING_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Apply migrations
        if: steps.check_secrets.outputs.configured == 'true'
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Verify migration status
        if: steps.check_secrets.outputs.configured == 'true'
        run: supabase migration list
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
